<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Events</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous">

    <link rel="stylesheet" href="./css/style.css"/>
</head>
<body class="events-page">
    <header class="site-header">
     <div class="container">
       <div class="row">
        <img class="img-fluid col-md-2 mt-4 mb-4 header-image"
        alt="Mount Mary University's logo."
        src="img/mt_mary_logo.jpg"
        />
        <nav class="col-md-10 mt-4">
            <ul class="list-unstyled d-flex justify-content-end gap-4">
                <li>
                    <a href="index.html"> 
                        Resources
                    </a>
                </li>
                <li>
                    <a href="page3.html">
                        Dining
                    </a>
                </li>
            </ul>
        </nav>
       </div>
     </div>
    </header>
    <main class="container">
        <section>
            <h1 class="text-center mb-4">Campus Events</h1>
            <div class="row g-4 align-items-start">
                <div class="col-md-4">
                    <img
                    class="img-fluid w-100"
                    alt="Calendar placeholder."
                    src="img/calendar_placeholder.png"
                    />
                <div class="mt-3 mb-4">
                    <label for="eventCategory" class="form-label">
                        Filter by Category
                    </label>
                    <select id="eventCategory" class="form-select">
                        <option value="all">All Categories</option>
                        <option value="academic">Academic</option>
                        <option value="student-life">Student Life</option>
                        <option value="arts">Arts and Culture</option>
                        <option value="wellness">Health and Wellness</option>
                    </select>
                </div>
            </div>
            <div class="col-md-8">
                <div class="row g-3">
                    <div class="col-12">
                        <div class="flip-card mb-3">
                            <div class="flip-card-inner">
                               <div class="flip-card-front card">
                                    <div class="p-3 pb-0">
                                        <p class="mb-0">Event Date</p>
                                    </div>
                                    <div class="row g-0 align-items-center flex-grow-1 p-3">
                                        <div class="col-8 d-flex justify-content-center align-items-center text-center">
                                            <h2 class="h5 mb-0">
                                                <a href="#" class="text-decoration-none flip-trigger">
                                                    Event Title
                                                </a>
                                            </h2>
                                        </div>
                                        <div class="col-4">
                                            <img
                                            class="img-fluid w-100 rounded"
                                            alt="Placeholder image."
                                            src="img/placeholder_img.png"
                                            />
                                        </div>
                                    </div>
                                </div>
                                <div class="flip-card-back card p-3">
                                    <h2 class="h5">Event Title</h2>
                                    <p>Event Description</p>
                                    <a href="#" class="btn btn-light">
                                        View Event
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="flip-card mb-3">
                            <div class="flip-card-inner">
                                <div class="flip-card-front card">
                                    <div class="p-3 pb-0">
                                        <p class="mb-0">Event Date</p>
                                    </div>
                                    <div class="row g-0 align-items-center flex-grow-1 p-3">
                                        <div class="col-8 d-flex justify-content-center align-items-center text-center">
                                            <h2 class="h5 mb-0">
                                                <a href="#" class="text-decoration-none flip-trigger">
                                                    Event Title
                                                </a>
                                            </h2>
                                        </div>
                                        <div class="col-4">
                                            <img
                                            class="img-fluid w-100 rounded"
                                            alt="Placeholder image."
                                            src="img/placeholder_img.png"
                                            />
                                        </div>
                                    </div>
                                </div>
                                <div class="flip-card-back card p-3">
                                    <h2 class="h5">Event Title</h2>
                                    <p>Event Description</p>
                                    <a href="#" class="btn btn-light">
                                        View Event
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </section>
        <article class="container my-5">
            <h3 class="text-center mb-4">Community Events</h3>
            <div id="event-container" class="row">
            <!--Community Resources API Output-->
            </div>
        </article>
    </main>
        <footer class="py-4 mt-4">
        <nav class="container">
            <ul class="list-unstyled d-flex justify-content-center gap-3">
                <li>
                    <a href="index.html" class="btn btn-light">Resources</a>
                </li>
                <li>
                    <a href="page3.html" class="btn btn-light">Dining</a>
                </li>
            </ul>
        </nav>
    </footer>
    <script src="./js/script.js"></script>
</body>
</html>
